<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenAI Codex 課程目錄</title>
<meta name="author" content="李振偉老師">
<meta name="description" content="OpenAI Codex 與 AI 基礎概念互動教學課程目錄，李振偉老師。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;--surface:#fffdf9;--ink:#15171c;--text:#2a2d34;--muted:#6d707a;--faint:#a3a5ad;
  --line:#e3dfd5;--line-strong:#cfcabd;
  --accent:#3049c4;--accent-ink:#fff;--accent-soft:rgba(48,73,196,.08);
  --hero-bg:#14161c;--hero-ink:#f4f1ea;--hero-muted:#a3a6b0;--hero-line:rgba(255,255,255,.09);
  --sans:"Inter","Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--surface:#161920;--ink:#f1eee7;--text:#d9d7d1;--muted:#9a9da7;--faint:#62656f;
  --line:#252932;--line-strong:#343944;
  --accent:#8ea0ff;--accent-ink:#0d1020;--accent-soft:rgba(142,160,255,.1);
  --hero-bg:#0a0b0e;--hero-line:rgba(255,255,255,.07);
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--surface:#161920;--ink:#f1eee7;--text:#d9d7d1;--muted:#9a9da7;--faint:#62656f;
  --line:#252932;--line-strong:#343944;
  --accent:#8ea0ff;--accent-ink:#0d1020;--accent-soft:rgba(142,160,255,.1);
  --hero-bg:#0a0b0e;--hero-line:rgba(255,255,255,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.container{max-width:1140px;margin:0 auto;padding:0 32px}

/* Hero */
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);
  background-size:56px 56px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 92%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 92%)}
.hero::after{content:"";position:absolute;width:560px;height:560px;right:-160px;top:-220px;border-radius:50%;
  background:radial-gradient(circle,rgba(92,118,255,.35),transparent 65%);pointer-events:none}
.hero .container{position:relative;padding-top:72px;padding-bottom:56px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--hero-muted);display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.hero h1{font:700 clamp(34px,5.4vw,58px)/1.15 var(--serif);letter-spacing:.01em;margin:22px 0 16px}
.hero h1 em{font-style:normal;color:#9fb0ff}
.nw{white-space:nowrap}
.hero .lead{max-width:600px;color:var(--hero-muted);font-size:17px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:52px 0 0;padding:0;list-style:none;border-top:1px solid rgba(255,255,255,.14)}
.stats li{padding:20px 20px 0 0}
.stats li + li{padding-left:20px;border-left:1px solid rgba(255,255,255,.14)}
.stats b{display:block;font:600 34px/1.1 var(--sans);letter-spacing:-.02em;color:var(--hero-ink);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--hero-muted)}

/* Layout */
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:64px;padding-top:56px;padding-bottom:96px}
.layout > *{min-width:0}
.sidebar{position:sticky;top:32px;align-self:start;max-height:calc(100vh - 64px);overflow:auto}
.sidebar h2{font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 18px}
.toc-part{margin-bottom:22px}
.toc-part p{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}
.toc-part a{display:flex;gap:10px;text-decoration:none;font-size:14px;line-height:1.45;color:var(--muted);padding:5px 0 5px 12px;border-left:2px solid var(--line);transition:color .15s,border-color .15s}
.toc-part a span{font:500 12px/1.6 var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}
.toc-part a:hover{color:var(--ink)}
.toc-part a.active{color:var(--ink);border-left-color:var(--accent);font-weight:500}
.toc-part a.active span{color:var(--accent)}

/* Parts */
.part + .part{margin-top:80px}
.part-head{display:flex;align-items:baseline;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line-strong)}
.part-no{font:600 12px/1 var(--sans);letter-spacing:.2em;color:var(--accent);white-space:nowrap}
.part-head h2{font:700 26px/1.3 var(--serif);color:var(--ink);margin:0}
.part-head p{margin:0 0 0 auto;font-size:13px;color:var(--faint);white-space:nowrap}

/* Course */
.course{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:36px 0;border-bottom:1px solid var(--line);scroll-margin-top:24px}
.idx{font:300 44px/1 var(--sans);letter-spacing:-.04em;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:4px;transition:color .2s}
.course:hover .idx{color:var(--accent)}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.kicker .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.kicker .repo{margin-left:auto;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--faint);transition:color .15s}
.kicker .repo:hover{color:var(--ink)}
.kicker .repo svg{width:15px;height:15px}
.course h3{font:700 25px/1.35 var(--serif);color:var(--ink);margin:8px 0 2px}
.subtitle{margin:0;color:var(--muted);font-size:15px}
.goal{margin:16px 0 0;max-width:680px;font-size:15px;color:var(--text);padding-left:14px;border-left:2px solid var(--line-strong)}
.goal small{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--faint);margin-bottom:2px}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font:500 14px/1 var(--sans);padding:11px 16px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface);transition:border-color .15s,background .15s,color .15s,transform .15s}
.btn:hover{border-color:var(--ink);transform:translateY(-1px)}
.btn svg{width:12px;height:12px;flex:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn .arrow{transition:transform .15s}
.btn:hover .arrow{transform:translateX(2px)}
.langs{font-size:13px;color:var(--faint);margin-left:4px}

details.chapters{margin-top:20px;max-width:680px}
details.chapters summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);user-select:none}
details.chapters summary::-webkit-details-marker{display:none}
details.chapters summary svg{width:12px;height:12px;transition:transform .2s}
details.chapters[open] summary svg{transform:rotate(90deg)}
details.chapters summary:hover{color:var(--ink)}
.timeline{list-style:none;margin:14px 0 0;padding:4px 0 4px 18px;border-left:1px solid var(--line-strong);columns:2;column-gap:32px}
.timeline li{break-inside:avoid;display:grid;grid-template-columns:44px 1fr;font-size:14px;padding:4px 0;color:var(--text)}
.timeline time{font:500 12px/1.9 var(--sans);color:var(--faint);font-variant-numeric:tabular-nums}

/* Series episodes */
.episodes{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.ep{padding:22px 24px}
.ep + .ep{border-top:1px solid var(--line)}
.ep-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ep-tag{font:600 11px/1 var(--sans);letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:6px}
.ep h4{font:700 17px/1.45 var(--serif);color:var(--ink);margin:0;flex:1;min-width:200px}
.ep-dur{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.ep .goal{margin-top:12px;font-size:14px}
.ep .actions{margin-top:16px}
.ep .btn{padding:9px 14px;font-size:13px}
.ep details.chapters{margin-top:14px}

/* Works showcase */
.subhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-top:48px;padding-bottom:14px;border-bottom:1px dashed var(--line-strong)}
.subhead h3{font:700 19px/1.4 var(--serif);color:var(--ink);margin:0}
.subhead span{font-size:13px;color:var(--muted)}
.kicker .model{font:600 11px/1 var(--sans);letter-spacing:.08em;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:4px 9px}
.toc-sub{margin-top:10px!important;font-weight:500!important;color:var(--faint)!important}

footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--faint);font-size:13px}
footer .container{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}

@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-top:28px}
  .sidebar{position:static;max-height:none;overflow:visible;margin-bottom:24px}
  .sidebar h2,.toc-part p{display:none}
  .toc-wrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .toc-part{display:contents}
  .toc-part a{flex:none;border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;background:var(--surface)}
  .toc-part a.active{border-color:var(--accent)}
}
@media (max-width:640px){
  .container{padding:0 16px}
  .hero .container{padding-top:48px;padding-bottom:36px}
  .stats{grid-template-columns:repeat(2,1fr);margin-top:36px}
  .stats li,.stats li + li{padding:16px 0 4px;border-left:0}
  .stats li:nth-child(even){padding-left:16px;border-left:1px solid rgba(255,255,255,.14)}
  .stats b{font-size:28px}
  .part + .part{margin-top:56px}
  .part-head{flex-wrap:wrap;gap:6px 14px}
  .part-head h2{font-size:22px}
  .part-head p{display:none}
  .course{grid-template-columns:1fr;gap:4px;padding:28px 0}
  .idx{font-size:30px}
  .course h3{font-size:21px}
  .kicker .repo{margin-left:0}
  .timeline{columns:1}
  .ep{padding:18px 16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>

const ICON_PLAY = '<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="M3 1.5v9l7.5-4.5z"/></svg>';
const ICON_ARROW = '<svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M2 6h8M6.5 2.5 10 6l-3.5 3.5"/></svg>';
const ICON_CHEV = '<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4.5 2.5 8 6l-3.5 3.5"/></svg>';
const ICON_GH = '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = s => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
const pad = n => String(n).padStart(2, '0');
const withVariant = (path, v) => BASE + path + (path.includes('?') ? '&' : '?') + 'variant=' + encodeURIComponent(v);
const btn = (href, label, primary, icon) =>
  `<a class="btn${primary ? ' primary' : ''}" href="${esc(href)}" target="_blank" rel="noopener">${icon || ICON_PLAY}${esc(label)}</a>`;
const repoLink = repo =>
  `<a class="repo" href="https://github.com/APPJust/${esc(repo)}" target="_blank" rel="noopener" aria-label="GitHub repo：${esc(repo)}">${ICON_GH}GitHub</a>`;

function actions(item, repo) {
  if (item.variants) return `<div class="actions">${item.variants.map(([v, label], i) => btn(withVariant(item.player, v), label, i === 0)).join('')}</div>`;
  return `<div class="actions">${btn(BASE + repo + '/', '開始觀看', true)}<span class="langs">${esc(item.langs)}，進入後切換</span></div>`;
}
function goal(item) {
  return item.goal ? `<p class="goal"><small>${esc(item.goalLabel || '學習目標')}</small>${esc(item.goal)}</p>` : '';
}
function chapters(item) {
  if (!item.chapters) return '';
  return `<details class="chapters"><summary>${ICON_CHEV}章節 ${item.chapters.length}</summary><ol class="timeline">${
    item.chapters.map(([t, n]) => `<li><time>${mmss(t)}</time><span>${esc(n)}</span></li>`).join('')}</ol></details>`;
}

function render() {
  const list = document.getElementById('list'), toc = document.getElementById('toc');
  let n = 0, units = 0, secs = 0, works = 0;
  PARTS.forEach((part, pi) => {
    const sec = document.createElement('section');
    sec.className = 'part';
    sec.innerHTML = `<div class="part-head"><span class="part-no">PART ${pad(pi + 1)}</span><h2>${esc(part.title)}</h2><p>${esc(part.en)}</p></div>`;
    let tocHtml = `<div class="toc-part"><p>${pad(pi + 1)}　${esc(part.title)}</p>`;
    for (const c of part.courses) {
      n++;
      const total = c.eps ? c.eps.reduce((a, e) => a + e.duration, 0) : c.duration;
      units += c.eps ? c.eps.length : 1; secs += total;
      const dur = c.durationNote || (c.eps ? `${c.eps.length} 集・` : '') + `約 ${Math.round(total / 60)} 分鐘`;
      const el = document.createElement('article');
      el.className = 'course'; el.id = c.id;
      el.innerHTML = `
        <div class="idx">${pad(n)}</div>
        <div>
          <div class="kicker"><span>${esc(dur)}</span>${repoLink(c.repo)}</div>
          <h3>${esc(c.title)}</h3>
          <p class="subtitle">${esc(c.subtitle)}</p>
          ${c.eps ? `
            <div class="actions">${btn(BASE + c.repo + '/', '系列首頁', false, ICON_ARROW)}</div>
            <div class="episodes">${c.eps.map((e, i) => `
              <div class="ep">
                <div class="ep-head"><span class="ep-tag">EP${i + 1}</span><h4>${esc(e.name)}</h4><span class="ep-dur">${mmss(e.duration)}</span></div>
                ${goal(e)}${actions(e, c.repo)}${chapters(e)}
              </div>`).join('')}
            </div>` : `${goal(c)}${actions(c, c.repo)}${chapters(c)}`}
        </div>`;
      sec.append(el);
      tocHtml += `<a href="#${c.id}"><span>${pad(n)}</span>${esc(c.title)}</a>`;
    }
    if (part.works) {
      const w = part.works;
      if (w.title) {
        sec.insertAdjacentHTML('beforeend', `<div class="subhead"><h3>${esc(w.title)}</h3><span>${esc(w.note)}</span></div>`);
        tocHtml += `<p class="toc-sub">${esc(w.title)}</p>`;
      }
      for (const it of w.items) {
        n++; works += it.group ? it.group.length : 1;
        const el = document.createElement('article');
        el.className = 'course work'; el.id = it.id;
        el.innerHTML = `
          <div class="idx">${pad(n)}</div>
          <div>
            <div class="kicker"><span class="model">${esc(w.model)}</span><span>${esc(it.type)}</span>${it.note ? `<span class="dot"></span><span>${esc(it.note)}</span>` : ''}${it.repo ? repoLink(it.repo) : ''}</div>
            <h3>${esc(it.title)}</h3>
            <p class="subtitle">${esc(it.subtitle)}</p>
            ${it.group ? `<div class="episodes">${it.group.map(g => `
              <div class="ep">
                <div class="ep-head"><span class="ep-tag">${esc(g.tag)}</span><h4>${esc(g.name)}</h4></div>
                <p class="goal">${esc(g.desc)}</p>
                <div class="actions">${btn(g.url, '開啟作品', true, ICON_ARROW)}</div>
              </div>`).join('')}
            </div>` : `
            <p class="goal"><small>作品內容</small>${esc(it.desc)}</p>
            <div class="actions">${btn(it.url, it.btnLabel || '開啟網站', true, it.btnLabel ? ICON_PLAY : ICON_ARROW)}${(it.links || []).map(([l, u]) => btn(u, l, false)).join('')}</div>`}
          </div>`;
        sec.append(el);
        tocHtml += `<a href="#${it.id}"><span>${pad(n)}</span>${esc(it.title)}</a>`;
      }
    }
    list.append(sec);
    toc.insertAdjacentHTML('beforeend', tocHtml + '</div>');
  });
  document.getElementById('stats').innerHTML =
    `<li><b>${PARTS.reduce((a, p) => a + p.courses.length, 0)}</b><span>門課程</span></li><li><b>${works}</b><span>個實作作品</span></li><li><b>${units}</b><span>個互動教學單元</span></li><li><b>${Math.round(secs / 60)}</b><span>分鐘教學內容</span></li>`;

  // 目錄隨捲動標示目前課程
  const links = new Map([...toc.querySelectorAll('a')].map(a => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) {
      links.forEach(a => a.classList.remove('active'));
      links.get(e.target.id)?.classList.add('active');
    }
  }, { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('.course').forEach(el => io.observe(el));
}
render();
</script>
